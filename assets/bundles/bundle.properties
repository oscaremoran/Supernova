team.aliens.name = Aliens

item.supernova-ferrite.name = Ferrite
item.supernova-ferrite.description = A dense, rust-gray metal found across the surface of Aphelion. The backbone of early construction.
item.supernova-cobaltine.name = Cobaltine
item.supernova-cobaltine.description = A blue conductive ore. Used for wiring, circuits and power systems.
item.supernova-quartzite.name = Quartzite
item.supernova-quartzite.description = Pale crystalline rock. Used as a flux when smelting and for optics.
item.supernova-ferrosteel.name = Ferrosteel
item.supernova-ferrosteel.description = Ferrite smelted with quartzite into a hard structural alloy.
item.supernova-iridium.name = Iridium
item.supernova-iridium.description = An extremely hard metal found only in the metallic asteroids of the Aphelion Belt.
item.supernova-cryo-ice.name = Cryo-Ice
item.supernova-cryo-ice.description = Frozen volatiles harvested from icy asteroids. Melt it down for propellant.
item.supernova-conductium.name = Conductium
item.supernova-conductium.description = A superconducting alloy of cobaltine and iridium. The core of advanced electronics.

liquid.supernova-volatiles.name = Volatiles
liquid.supernova-volatiles.description = Light, flammable gases melted from cryo-ice. Fuels orbital mining missions.

block.supernova-ore-ferrite.name = Ferrite Ore
block.supernova-ore-cobaltine.name = Cobaltine Ore
block.supernova-ore-quartzite.name = Quartzite Ore
block.supernova-ferrite-drill.name = Ferrite Drill
block.supernova-ferrite-drill.description = A basic mechanical drill. Mines Aphelion's surface ores.
block.supernova-ferrosteel-smelter.name = Ferrosteel Smelter
block.supernova-ferrosteel-smelter.description = Smelts ferrite with quartzite flux into ferrosteel.
block.supernova-ice-melter.name = Ice Melter
block.supernova-ice-melter.description = Melts cryo-ice into volatiles.
block.supernova-conductium-fabricator.name = Conductium Fabricator
block.supernova-conductium-fabricator.description = Fuses cobaltine and iridium into conductium.

block.supernova-orbital-uplink.name = Orbital Uplink
block.supernova-orbital-uplink.description = Launches mining drones into the Aphelion Belt. Pick a target zone; drones return with asteroid cargo. Runs on power. Volatiles speed up missions.
stat.supernova-mission-speed = mission speed
zone.supernova-metallic.name = Metallic Belt
zone.supernova-icy.name = Icy Belt

planet.supernova-prime.name = Prime System
planet.supernova-aphelion.name = Aphelion
planet.supernova-aphelion.description = A cold, rocky world at the edge of a dying star. The surface is poor, but the asteroid belt overhead is rich. The Aliens are already here.

unit.supernova-pioneer.name = Pioneer
unit.supernova-pioneer.description = Aphelion's core unit. Builds structures and mines surface ore by hand.
unit.supernova-prospector.name = Prospector
unit.supernova-prospector.description = A small mining drone. Automatically mines ferrite, cobaltine and quartzite and delivers them to the core.
unit.supernova-surveyor.name = Surveyor
unit.supernova-surveyor.description = An upgraded mining drone. Mines faster and carries more.
unit.supernova-hauler.name = Hauler
unit.supernova-hauler.description = A cargo drone. Collects asteroid cargo from Orbital Uplinks and carries it to the core.

block.supernova-ferrite-conveyor.name = Ferrite Conveyor
block.supernova-ferrite-conveyor.description = Moves items forward.
block.supernova-ferrite-junction.name = Ferrite Junction
block.supernova-ferrite-junction.description = Lets two conveyor lines cross.
block.supernova-ferrite-router.name = Ferrite Router
block.supernova-ferrite-router.description = Splits items between up to three directions.
block.supernova-ferrite-bridge.name = Ferrite Bridge
block.supernova-ferrite-bridge.description = Carries items over terrain and buildings.
block.supernova-solar-array.name = Solar Array
block.supernova-solar-array.description = Generates a small amount of power from the Prime System's dim star.
block.supernova-volatile-burner.name = Volatile Burner
block.supernova-volatile-burner.description = Burns volatiles for a large amount of power.
block.supernova-ferrite-power-node.name = Ferrite Power Node
block.supernova-ferrite-power-node.description = Carries power between connected blocks.
block.supernova-ferrite-wall.name = Ferrite Wall
block.supernova-ferrite-wall.description = A basic defensive wall.
block.supernova-ferrite-wall-large.name = Large Ferrite Wall
block.supernova-ferrite-wall-large.description = A basic defensive wall covering four tiles.
block.supernova-ferrosteel-wall.name = Ferrosteel Wall
block.supernova-ferrosteel-wall.description = An armored wall that reduces incoming damage.
block.supernova-ferrosteel-wall-large.name = Large Ferrosteel Wall
block.supernova-ferrosteel-wall-large.description = An armored wall covering four tiles.
block.supernova-bolter.name = Bolter
block.supernova-bolter.description = A twin-barrel turret. Fires ferrite slugs, or piercing ferrosteel slugs.
block.supernova-drone-bay.name = Drone Bay
block.supernova-drone-bay.description = Builds mining and cargo drones.
block.supernova-core-outpost.name = Core: Outpost
block.supernova-core-outpost.description = Aphelion's landing core. Stores resources and builds Pioneers.

techtree.aphelion = Aphelion

tutorial.supernova.mine = [accent]Welcome to Aphelion.[]\nYour ship, the [accent]Pioneer[], can mine by hand.\n[accent]Click or tap[] the marked [accent]ferrite ore[] to start mining it. Mined ore flies back to your core.
tutorial.supernova.drills = Mining by hand is slow. [accent]Ferrite Drills[] mine automatically.\nOpen the build menu (bottom right), pick the drill, and place [accent]4 drills[] on the marked ferrite ore.
tutorial.supernova.conveyors = Drills need a way to get ore to the core.\nPlace [accent]Ferrite Conveyors[] from your drills to the [accent]core[]. Drag to place a line.
tutorial.supernova.cobaltine = [accent]Cobaltine[] is the blue ore. It's needed for turrets and power.\nMine it by hand or put drills on it, and send it to the core.
tutorial.supernova.research = The [accent]Aliens[] are coming.\nOpen the [accent]tech tree[] (the research button in the menu) and research the [accent]Bolter[] turret.
tutorial.supernova.defend = The Aliens come from the marked [red]spawn point[].\nBuild [accent]2 Bolters[] between the spawn and your base, and feed them [accent]ferrite[] as ammo by conveyor.
tutorial.supernova.quartzite = [accent]Quartzite[] is the pale ore. It's needed for solar power and smelting.\nMine it and send it to the core.
tutorial.supernova.power = Research and build [accent]2 Solar Arrays[].\nLink power to buildings with [accent]Ferrite Power Nodes[].
tutorial.supernova.smelt = Research and build a [accent]Ferrosteel Smelter[].\nFeed it [accent]ferrite[] and [accent]quartzite[], give it power, and send the [accent]ferrosteel[] to the core.
tutorial.supernova.drones = Research and build a [accent]Drone Bay[], then make [accent]2 Prospectors[].\nProspectors mine ore and bring it to the core on their own.
tutorial.supernova.uplink = Aphelion's real wealth is in orbit.\nBuild an [accent]Orbital Uplink[], click it, and pick the [accent]Metallic Belt[]. Its drones bring back [accent]iridium[], which can't be mined on the surface.

marker.ore-ferrite = [accent]Ferrite[]\n[lightgray]click to mine
marker.drills = [accent]Place drills here
marker.core = [accent]Your core[]\n[lightgray]bring ore here
marker.ore-cobaltine = [accent]Cobaltine[]\n[lightgray]blue ore
marker.ore-quartzite = [accent]Quartzite[]\n[lightgray]pale ore
marker.spawn = [red]Aliens arrive here
marker.uplink = [accent]Build an Orbital Uplink[]\n[lightgray]near your core

unit.supernova-hatchling.name = Hatchling
unit.supernova-hatchling.description = [#b98cff]Bug, tier 1.[] A small, fast Alien. Weak, but it comes in numbers and never stops spitting acid.
unit.supernova-malign.name = Malign
unit.supernova-malign.description = [#b98cff]Bug, tier 2.[] A tougher bug that lobs purple orbs, which burst into a ring of smaller orbs.
unit.supernova-leacher.name = Leacher
unit.supernova-leacher.description = [#ff4d6a]Predator, tier 1.[] A tough brawler. Its bites heal it for part of the damage they deal.
unit.supernova-ripper.name = Ripper
unit.supernova-ripper.description = [#ff4d6a]Predator, tier 2.[] A heavy Alien that sweeps the battlefield with a sustained crimson beam.

block.supernova-hive.name = Hive
block.supernova-hive.description = An Alien nest. Hatches a Hatchling every 40 seconds, up to 3 alive nearby. Destroy it to stop the flow.
block.supernova-spore-pod.name = Spore Pod
block.supernova-spore-pod.description = A small Alien turret that spits acid. Needs no ammo.
block.supernova-acid-spire.name = Acid Spire
block.supernova-acid-spire.description = A heavy Alien turret. Fires acid orbs that burst into six smaller orbs.
block.supernova-chitin-wall.name = Chitin Wall
block.supernova-chitin-wall.description = Alien armor plating that slowly regrows when damaged.
block.supernova-chitin-wall-large.name = Large Chitin Wall
block.supernova-chitin-wall-large.description = Alien armor plating that slowly regrows when damaged.
block.supernova-core-brood.name = Core: Brood
block.supernova-core-brood.description = The heart of an Alien base. Destroy every Core: Brood to take the sector.

sector.supernova-landing-site.name = Landing Site
sector.supernova-landing-site.description = Your first foothold on Aphelion. Learn to mine, build and defend against the first Hatchlings.
sector.supernova-frost-ridge.name = Frost Ridge
sector.supernova-frost-ridge.description = A frozen ridge rich in quartzite. Build power and smelt ferrosteel. Leachers have been seen here.
sector.supernova-uplink-crater.name = Uplink Crater
sector.supernova-uplink-crater.description = A crater under a clear patch of sky, ideal for an Orbital Uplink. Reach the Metallic Belt for iridium. Watch for Malign.
sector.supernova-ice-shelf.name = Ice Shelf
sector.supernova-ice-shelf.description = A vast ice shelf. Melt cryo-ice into volatiles and power your base with it. Rippers roam here.
sector.supernova-the-hive.name = The Hive
sector.supernova-the-hive.description = The Aliens' nest. Destroy every Core: Brood.
