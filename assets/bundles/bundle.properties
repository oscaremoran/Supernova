unit.supernova-spawnling.name = Spawnling
unit.supernova-spawnling.description = A tiny Alien that swarms toward buildings and bursts in a spray of acid.
unit.supernova-skitter.name = Skitter
unit.supernova-skitter.description = The most common Alien. A fast four-legged walker that spits acid bolts.
unit.supernova-stalker.name = Stalker
unit.supernova-stalker.description = An armored Alien walker with heavier acid bolts.
unit.supernova-brute.name = Brute
unit.supernova-brute.description = A six-legged Alien that steps over walls and lobs explosive acid globs at long range.
unit.supernova-wisp.name = Wisp
unit.supernova-wisp.description = A small, fast Alien flyer that circles its targets.
unit.supernova-shrike.name = Shrike
unit.supernova-shrike.description = An Alien flyer with twin acid bolts.
unit.supernova-harrower.name = Harrower
unit.supernova-harrower.description = A heavy Alien flyer that fires homing acid bolts.
